name: Simulated-merge diff

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  merge-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0

      - name: Simulate merge and generate diff
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git fetch origin ${{ github.event.pull_request.head.ref }}
          git merge ${{ github.event.pull_request.head.sha }} --no-commit --no-ff || true
          git diff HEAD > simulated.diff

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render diff to Job Summary
        run: |
          if [ ! -s simulated.diff ]; then
            echo "### No differences found" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx diff2html-cli -i file -s side --highlightCode -F summary.html -- simulated.diff
          cat summary.html >> "$GITHUB_STEP_SUMMARY"
